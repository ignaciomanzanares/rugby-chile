# Render Blueprint — despliega la API (Fastify) del monorepo rugby-chile.
# El web (Next.js) va aparte en Vercel; la DB (Postgres) en Neon.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: rugby-chile-api
    runtime: node
    plan: free              # free duerme tras 15 min de inactividad (cold start ~30-50s)
    region: oregon
    branch: main
    # --include=dev: NODE_ENV=production haría que npm ci omita las devDependencies
    # (typescript, @types/*), pero el build (tsc) las necesita. En runtime no.
    buildCommand: npm ci --include=dev && npm run build --workspace=api
    startCommand: npm run start --workspace=api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV       # habilita cookies Secure + SameSite=None (auth cross-site web↔api)
        value: production
      - key: JWT_SECRET      # OBLIGATORIO: la API no arranca sin esto. Generar: openssl rand -hex 32
        sync: false          # setear a mano en el dashboard de Render (nunca en el repo)
      - key: DATABASE_URL   # pegar el connection string de Neon (Pooled, con ?sslmode=require)
        sync: false
      - key: WEB_URL        # la URL pública del web en Vercel (para CORS), ej: https://rugby-chile.vercel.app
        sync: false
      # Notificaciones push (Web Push). Sin estas, push queda deshabilitado (la
      # API igual arranca). Generar: npx web-push generate-vapid-keys
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT   # mailto: de contacto, ej: mailto:tu@email.com
        sync: false
