<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="robots" content="noindex, nofollow">
		<title>Comprobando tu navegador</title>
		<style>
			body { font-family: sans-serif; text-align: center; padding: 40px 20px; color: #333; }
			h1 { font-size: 28px; margin-bottom: 8px; }
			.barra { max-width: 320px; height: 6px; margin: 32px auto 0; background: #eee; border-radius: 3px; overflow: hidden; }
			.barra span { display: block; height: 100%; width: 0; background: #333; transition: width .2s linear; }
			.referencia { font-size: 14px; color: #777; margin-top: 32px; }
			.referencia strong { font-family: monospace; letter-spacing: 1px; color: #333; }
		</style>
	</head>
	<body>
		<h1>Comprobando tu navegador</h1>
		<p>Estamos comprobando que tu conexión es segura. Tarda solo unos segundos y es automático</p>

		<div class="barra"><span id="progreso"></span></div>

		<noscript>
			<p class="referencia">Necesitas activar JavaScript para continuar</p>
		</noscript>

		<p class="referencia">
			Si la comprobación no termina, contacta con soporte indicando este código<br>
			Código de referencia: <strong>5QFT25frAiyAETNRqw7B</strong>
		</p>

		<script>
			(function () {
				var RETO = '1787520706-18-f8e14beaf8c2350a', FIRMA = '4f0d257bd69e047690bdd400797c690728375dee268921bb5dc5fbfb7298145e', SEMILLA = 'f8e14beaf8c2350a', BITS = 18;

				var progreso = document.getElementById('progreso');

				// Los caminos de error de aquí abajo no hacen nada a propósito: la página ya tiene delante el
				// código de referencia y el mensaje de soporte, así que no queda nada que enseñarle a nadie

				// SHA-256 sincrono y busqueda del nonce, dentro de un worker para no congelar la interfaz. No se
				// usa crypto.subtle porque es asincrono y la sobrecarga por llamada se come el bucle
				var fuente = function () {
					var K = [
						0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
						0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
						0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
						0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
						0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
						0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
						0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
						0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2
					];

					function sha256(texto) {
						var bytes = [], i, j, c;

						for (i = 0; i < texto.length; i++) {
							c = texto.charCodeAt(i);
							if (c < 128) {
								bytes.push(c);
							} else if (c < 2048) {
								bytes.push(192 | (c >> 6), 128 | (c & 63));
							} else {
								bytes.push(224 | (c >> 12), 128 | ((c >> 6) & 63), 128 | (c & 63));
							}
						}

						var bits = bytes.length * 8;
						bytes.push(0x80);
						while ((bytes.length % 64) !== 56) { bytes.push(0); }
						bytes.push(0, 0, 0, 0, (bits >>> 24) & 255, (bits >>> 16) & 255, (bits >>> 8) & 255, bits & 255);

						var h = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19];
						var w = new Array(64);

						for (i = 0; i < bytes.length; i += 64) {
							for (j = 0; j < 16; j++) {
								w[j] = (bytes[i + j * 4] << 24) | (bytes[i + j * 4 + 1] << 16) |
									(bytes[i + j * 4 + 2] << 8) | bytes[i + j * 4 + 3];
							}

							for (j = 16; j < 64; j++) {
								var s0 = ((w[j - 15] >>> 7) | (w[j - 15] << 25)) ^ ((w[j - 15] >>> 18) | (w[j - 15] << 14)) ^ (w[j - 15] >>> 3);
								var s1 = ((w[j - 2] >>> 17) | (w[j - 2] << 15)) ^ ((w[j - 2] >>> 19) | (w[j - 2] << 13)) ^ (w[j - 2] >>> 10);
								w[j] = (w[j - 16] + s0 + w[j - 7] + s1) | 0;
							}

							var a = h[0], b = h[1], cc = h[2], d = h[3], e = h[4], f = h[5], g = h[6], hh = h[7];

							for (j = 0; j < 64; j++) {
								var S1 = ((e >>> 6) | (e << 26)) ^ ((e >>> 11) | (e << 21)) ^ ((e >>> 25) | (e << 7));
								var ch = (e & f) ^ (~e & g);
								var t1 = (hh + S1 + ch + K[j] + w[j]) | 0;
								var S0 = ((a >>> 2) | (a << 30)) ^ ((a >>> 13) | (a << 19)) ^ ((a >>> 22) | (a << 10));
								var maj = (a & b) ^ (a & cc) ^ (b & cc);
								var t2 = (S0 + maj) | 0;

								hh = g; g = f; f = e; e = (d + t1) | 0; d = cc; cc = b; b = a; a = (t1 + t2) | 0;
							}

							h[0] = (h[0] + a) | 0; h[1] = (h[1] + b) | 0; h[2] = (h[2] + cc) | 0; h[3] = (h[3] + d) | 0;
							h[4] = (h[4] + e) | 0; h[5] = (h[5] + f) | 0; h[6] = (h[6] + g) | 0; h[7] = (h[7] + hh) | 0;
						}

						return h;
					}

					// Comprueba los primeros bits del hash, que en h[0] y h[1] van como enteros de 32 bits
					function valeYa(h, bits) {
						if (bits <= 32) { return (h[0] >>> (32 - bits)) === 0; }
						return h[0] === 0 && (h[1] >>> (64 - bits)) === 0;
					}

					self.onmessage = function (evento) {
						var semilla = evento.data.semilla, bits = evento.data.bits;
						var objetivo = Math.pow(2, bits), nonce = 0;

						while (true) {
							if (valeYa(sha256(semilla + nonce), bits)) {
								self.postMessage({ nonce: nonce });
								return;
							}

							nonce++;

							if ((nonce % 2000) === 0) {
								self.postMessage({ avance: Math.min(0.99, nonce / objetivo) });
							}
						}
					};
				};

				function enviar(nonce) {
					if (progreso) { progreso.style.width = '100%'; }

					var url = location.href + (location.search ? '&' : '?') +
						'_pow_r=' + encodeURIComponent(RETO) +
						'&_pow_f=' + encodeURIComponent(FIRMA) +
						'&_pow_n=' + encodeURIComponent(nonce);

					fetch(url, { credentials: 'same-origin' }).then(function (respuesta) {
						if (respuesta.status === 204) {
							location.reload();
						}
					})['catch'](function () {});
				}

				try {
					var blob = new Blob(['(' + fuente.toString() + ')()'], { type: 'text/javascript' });
					var worker = new Worker(URL.createObjectURL(blob));

					worker.onmessage = function (evento) {
						if (evento.data.avance !== undefined && progreso) {
							progreso.style.width = Math.round(evento.data.avance * 100) + '%';
						} else if (evento.data.nonce !== undefined) {
							worker.terminate();
							enviar(evento.data.nonce);
						}
					};

					worker.postMessage({ semilla: SEMILLA, bits: BITS });
				} catch (e) {}
			})();
		</script>
	</body>
</html>
