name: scrape-arusa

# NO SIRVE PARA SCRAPEAR ARUSA: arusa bloquea las IPs de datacenter (Render Y
# GitHub) con 429 en la PRIMERA request (verificado 2026-08-23, 2 corridas). Solo
# las IPs residenciales tienen un cupo (~46) antes del ban. El minuto a minuto de
# arusa NO es scrapeable gratis desde la nube. El marcador en vivo NO usa esto:
# viene de Leverade (api.leverade.com), que Render sí alcanza.
#
# Se deja solo en manual (workflow_dispatch), sin cron, por si aparece una IP no
# baneada o para correrlo con un proxy residencial en el futuro. El scraper en sí
# (api/scripts/ciScrape.ts) sirve; el problema es la IP.
on:
  workflow_dispatch: {}

# Una corrida a la vez, encadenadas (sin solaparse ni cortar la anterior).
concurrency:
  group: scrape-arusa
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Scrape minuto a minuto → DB de prod
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx api/scripts/ciScrape.ts
