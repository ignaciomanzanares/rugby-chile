# Diagnóstico de por qué la API de Render rechaza subir a un plan pago (500),
# cuando el mismo cambio desde el dashboard funciona. Corre en GitHub para usar
# el secreto RENDER_API_KEY sin sacarlo de ahí. No imprime variables de entorno
# del servicio: solo la configuración y los códigos de respuesta.
#
# Prueba variantes del PATCH en orden y se detiene en la primera que funcione
# (esa deja el servicio en Starter y dispara el deploy que aplica el cambio).
name: render-diagnose

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      API: https://api.render.com/v1
      SVC: ${{ secrets.RENDER_SERVICE_ID }}
      KEY: ${{ secrets.RENDER_API_KEY }}
    steps:
      - name: Servicio, dueño y blueprints
        run: |
          set -uo pipefail
          auth=(-H "Authorization: Bearer $KEY" -H "Accept: application/json")
          echo "== servicio =="
          curl -sS "${auth[@]}" "$API/services/$SVC" | jq '{type, name, ownerId, suspended, autoDeploy, repo, branch, rootDir,
            serviceDetails: (.serviceDetails | del(.envSpecificDetails.buildCommand, .envSpecificDetails.startCommand))}'
          echo "== dueños visibles con esta llave =="
          curl -sS "${auth[@]}" "$API/owners?limit=20" | jq '[.[].owner | {id, name, type}]'
          echo "== blueprints =="
          curl -sS "${auth[@]}" "$API/blueprints?limit=20" | jq '[.[].blueprint | {id, name, status, autoSync, repo, branch, lastSync}]'

      - name: Variantes del PATCH
        run: |
          set -uo pipefail
          intentar () {
            local nombre="$1" body="$2"
            code=$(curl -sS -D headers.txt -o resp.json -w '%{http_code}' -X PATCH "$API/services/$SVC" \
              -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d "$body")
            rid=$(grep -i -E '^(x-request-id|rndr-id|request-id):' headers.txt | head -1 | tr -d '\r')
            echo "[$nombre] HTTP $code  $rid"
            echo "   body: $body"
            echo "   resp: $(head -c 400 resp.json)"
            [ "$code" -lt 300 ]
          }

          # Solo variantes a Starter: una a Standard, si funcionara, dejaría el
          # servicio en un plan más caro del que se quiere.
          ok=0
          while IFS='|' read -r nombre body; do
            [ -z "$nombre" ] && continue
            if intentar "$nombre" "$body"; then ok=1; break; fi
          done <<'VARIANTES'
          plan|{"serviceDetails":{"plan":"starter"}}
          plan+previews off|{"serviceDetails":{"plan":"starter","previews":{"generation":"off"}}}
          plan+PR previews no|{"serviceDetails":{"plan":"starter","pullRequestPreviewsEnabled":"no"}}
          plan+1 instancia|{"serviceDetails":{"plan":"starter","numInstances":1}}
          plan+shutdown delay|{"serviceDetails":{"plan":"starter","maxShutdownDelaySeconds":30}}
          VARIANTES

          if [ "$ok" = "1" ]; then
            echo "== una variante funcionó: deploy para aplicar el plan =="
            curl -sS -o dep.json -w 'POST deploy -> HTTP %{http_code}\n' -X POST "$API/services/$SVC/deploys" \
              -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{"clearCache":"do_not_clear"}'
            curl -sS -H "Authorization: Bearer $KEY" "$API/services/$SVC" | jq -r '"plan ahora: \(.serviceDetails.plan)"'
          else
            echo "== ninguna variante funcionó =="
          fi
