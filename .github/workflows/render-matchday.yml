name: render-matchday

# Sube el servicio de Render a Starter (always-on) los findes de partido y lo baja
# a Free entre semana, automático: sin arranques en frío durante los partidos y
# sin pagar Starter todo el mes. Corre en la infra de GitHub.
#   - Sábado temprano: sube a Starter SOLO si hay partido en los próximos 4 días.
#   - Lunes:           baja a Free.
# Manual (workflow_dispatch) para probar: starter / free / auto.
#
# CÓMO cambia el plan: editando la línea `plan:` de render.yaml y haciendo commit.
# El Blueprint "rugby-chile" (con Auto Sync ENCENDIDO) lo aplica al sincronizar.
#
# Por qué no la API de Render: para este servicio, el PATCH del plan responde
# 500 {"message":"internal server error"} a todo cambio real desde el 1 de
# septiembre, en las dos direcciones. Descartado de nuestro lado: formato del
# pedido, nombre del plan ("starter" y "0.5c-512mb"), medio de pago, previews y
# Auto Sync. En cambio la sincronización del Blueprint sí cambia el plan: así
# bajó a Free el 1 de septiembre, 7 segundos después de un commit a render.yaml,
# cuando la API no podía. La API se sigue usando, pero solo para LEER el plan y
# confirmar que quedó aplicado.
#
# Requiere:
#   - Auto Sync del Blueprint encendido (Render → Blueprints → rugby-chile).
#   - Secrets RENDER_API_KEY y RENDER_SERVICE_ID (solo para la verificación).
#
# render-keepwarm sigue corriendo igual como red de seguridad.
on:
  schedule:
    - cron: "0 9 * * 6"    # Sáb 09:00 UTC (06:00 Chile) — subir si hay partido en los próximos 4 días
    - cron: "0 12 * * 1"   # Lun 12:00 UTC (09:00 Chile) — bajar a Free
  workflow_dispatch:
    inputs:
      plan:
        description: "Forzar plan (auto = decide por fecha)"
        required: true
        default: auto
        type: choice
        options: [auto, starter, free]

concurrency:
  group: render-matchday
  cancel-in-progress: false

permissions:
  contents: write   # para commitear el cambio de plan en render.yaml

jobs:
  toggle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      API_BASE: https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}
      RENDER_KEY: ${{ secrets.RENDER_API_KEY }}
      RESULTS_URL: https://rugby-chile-api.onrender.com/api/v1/leverade/results
    steps:
      - name: Decidir plan
        id: decide
        run: |
          set -euo pipefail
          sched="${{ github.event.schedule }}"
          manual="${{ github.event.inputs.plan }}"
          if [ -n "${manual:-}" ] && [ "${manual}" != "auto" ]; then
            plan="$manual"                       # forzado a mano
          elif [ "$sched" = "0 12 * * 1" ]; then
            plan="free"                          # cron del lunes
          else
            # Sábado o dispatch=auto: subir SOLO si hay partido en los próximos 4 días.
            echo "Chequeo partidos del finde (cold-start del free puede tardar)…"
            curl -s --max-time 90 --retry 3 --retry-delay 15 "$RESULTS_URL" -o results.json || echo '{}' > results.json
            now=$(date -u +%s)
            soon=$((now + 4 * 86400))
            cnt=$(jq -r --argjson now "$now" --argjson soon "$soon" '
              [ .[]?
                | select((.finished | not) and (.datetime != null))
                | (.datetime | strptime("%Y-%m-%d %H:%M:%S") | mktime)
                | select(. >= $now and . <= $soon) ] | length' results.json 2>/dev/null || echo err)
            if [ "$cnt" = "0" ]; then
              echo "Sin partidos en 4 días → no toco nada."
              plan="skip"
            else
              echo "Hay partido (o no pude verificar) → subir. (cnt=$cnt)"
              plan="starter"                     # yes o error → subir (mejor pagar centavos que perder el vivo)
            fi
          fi
          echo "plan=$plan" >> "$GITHUB_OUTPUT"
          echo "==> plan decidido: $plan"

      - uses: actions/checkout@v4
        if: steps.decide.outputs.plan != 'skip'

      - name: Fijar el plan en render.yaml (lo aplica el Blueprint)
        if: steps.decide.outputs.plan != 'skip'
        run: |
          set -euo pipefail
          plan="${{ steps.decide.outputs.plan }}"
          actual=$(grep -E '^[[:space:]]+plan:' render.yaml | head -1 | awk '{print $2}' || true)
          echo "render.yaml dice: plan: ${actual:-(sin plan)}"
          if [ "$actual" = "$plan" ]; then
            echo "Ya dice $plan → no hay nada que commitear."
            exit 0
          fi
          if [ -n "$actual" ]; then
            sed -i -E "s/^([[:space:]]+)plan: .*/\1plan: $plan/" render.yaml
          else
            sed -i -E "s/^([[:space:]]+)runtime: node$/&\n\1plan: $plan/" render.yaml
          fi
          grep -nE '^[[:space:]]+plan:' render.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "render: plan $plan (render-matchday, $(date -u +%F))"
          for i in 1 2 3; do
            if git pull --rebase -q && git push -q; then break; fi
            echo "push rechazado, reintento ($i)"; sleep 5
          done

      - name: Confirmar que Render aplicó el plan
        if: steps.decide.outputs.plan != 'skip'
        run: |
          set -uo pipefail
          plan="${{ steps.decide.outputs.plan }}"
          # La sincronización del Blueprint tarda unos segundos en tomar el commit,
          # y el plan se registra al empezar el deploy que dispara. Hasta 10 min.
          for i in $(seq 1 20); do
            real=$(curl -sS "$API_BASE" -H "Authorization: Bearer $RENDER_KEY" | jq -r '.serviceDetails.plan // "?"')
            echo "$(date -u +%H:%M:%S) plan en Render: $real"
            if [ "$real" = "$plan" ] || { [ "$plan" = "starter" ] && [ "$real" = "0.5c-512mb" ]; }; then
              echo "Listo: Render está en $plan"; exit 0
            fi
            sleep 30
          done
          echo "::error::render.yaml dice $plan pero Render sigue en '$real' a los 10 min. ¿Está encendido el Auto Sync del Blueprint rugby-chile?"
          exit 1
