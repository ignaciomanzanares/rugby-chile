name: render-matchday

# Sube el servicio de Render a Starter (always-on) los findes de partido y lo baja
# a Free entre semana, automático — para tener el minuto a minuto en vivo sin pagar
# Starter todo el mes. Corre en la infra de GitHub, no depende de la notebook.
#   - Sábado temprano: sube a Starter SOLO si hay partido en los próximos 4 días.
#   - Lunes:           baja a Free.
# Manual (workflow_dispatch) para probar: elegí starter / free / auto.
#
# Requiere 2 secrets del repo (Settings → Secrets and variables → Actions):
#   RENDER_API_KEY     — Render → Account Settings → API Keys → Create API Key
#   RENDER_SERVICE_ID  — el id del servicio (srv-xxxx), en la URL del dashboard del
#                        servicio. Es el de rugby-chile-api.

# Por qué fallaba: el PATCH a "free" responde 200, pero a "starter" responde
# 500 {"message":"internal server error"} — todas las corridas desde el 1 de
# septiembre. La llave, el servicio y el formato están bien; lo que revienta es
# el NOMBRE del plan. La API lista los tipos de instancia nuevos por tamaño
# (Starter = "0.5c-512mb", media CPU y 512 MB), así que se prueba "starter" y,
# si da 500, el nombre nuevo. Si Render responde 402 es que falta cargar un
# medio de pago en la cuenta, y el error lo dice.
#
# render-keepwarm sigue corriendo igual: si la subida falla, la API al menos no
# se duerme durante los partidos.
on:
  schedule:
    - cron: "0 9 * * 6"    # Sáb 09:00 UTC (06:00 Chile) — subir si hay partido en los próximos 4 días
    - cron: "0 12 * * 1"   # Lun 12:00 UTC — bajar a Free
  workflow_dispatch:
    inputs:
      plan:
        description: "Forzar plan (auto = decide por fecha)"
        required: true
        default: auto
        type: choice
        options: [auto, starter, free]

concurrency:
  group: render-matchday
  cancel-in-progress: false

jobs:
  toggle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      API_BASE: https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}
      RENDER_KEY: ${{ secrets.RENDER_API_KEY }}
      RESULTS_URL: https://rugby-chile-api.onrender.com/api/v1/leverade/results
    steps:
      - name: Decidir plan
        id: decide
        run: |
          set -euo pipefail
          sched="${{ github.event.schedule }}"
          manual="${{ github.event.inputs.plan }}"
          if [ -n "${manual:-}" ] && [ "${manual}" != "auto" ]; then
            plan="$manual"                       # forzado a mano
          elif [ "$sched" = "0 12 * * 1" ]; then
            plan="free"                          # cron del lunes
          else
            # Sábado o dispatch=auto: subir SOLO si hay partido en los próximos 4 días.
            echo "Chequeo partidos del finde (cold-start del free puede tardar)…"
            curl -s --max-time 90 --retry 3 --retry-delay 15 "$RESULTS_URL" -o results.json || echo '{}' > results.json
            now=$(date -u +%s)
            soon=$((now + 4 * 86400))
            cnt=$(jq -r --argjson now "$now" --argjson soon "$soon" '
              [ .[]?
                | select((.finished | not) and (.datetime != null))
                | (.datetime | strptime("%Y-%m-%d %H:%M:%S") | mktime)
                | select(. >= $now and . <= $soon) ] | length' results.json 2>/dev/null || echo err)
            if [ "$cnt" = "0" ]; then
              echo "Sin partidos en 4 días → no toco nada."
              plan="skip"
            else
              echo "Hay partido (o no pude verificar) → subir. (cnt=$cnt)"
              plan="starter"                     # yes o error → subir (mejor pagar centavos que perder el vivo)
            fi
          fi
          echo "plan=$plan" >> "$GITHUB_OUTPUT"
          echo "==> plan decidido: $plan"

      - name: Aplicar plan + deploy en Render
        if: steps.decide.outputs.plan != 'skip'
        run: |
          set -euo pipefail
          plan="${{ steps.decide.outputs.plan }}"
          # Nombres a probar, en orden. Para Starter: el heredado y el nuevo.
          if [ "$plan" = "starter" ]; then candidatos="starter 0.5c-512mb"; else candidatos="$plan"; fi

          aplicado=""
          for p in $candidatos; do
            echo "Cambiando Render a: $p"
            code=$(curl -sS -o resp.json -w '%{http_code}' -X PATCH "$API_BASE" \
              -H "Authorization: Bearer $RENDER_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"serviceDetails\":{\"plan\":\"$p\"}}")
            echo "PATCH plan=$p -> HTTP $code"; head -c 500 resp.json; echo
            if [ "$code" = "402" ]; then
              echo "::error::Render pide un medio de pago: cargar una tarjeta en Billing del dashboard y volver a correr."
              exit 1
            fi
            if [ "$code" -lt 300 ]; then aplicado="$p"; break; fi
          done
          if [ -z "$aplicado" ]; then echo "::error::PATCH del plan fallo con todos los nombres ($candidatos)"; exit 1; fi
          # El cambio de plan NO se aplica hasta un deploy (dixit API de Render).
          code=$(curl -sS -o dep.json -w '%{http_code}' -X POST "$API_BASE/deploys" \
            -H "Authorization: Bearer $RENDER_KEY" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":"do_not_clear"}')
          echo "POST deploy -> HTTP $code"; head -c 300 dep.json; echo
          if [ "$code" -ge 300 ]; then echo "::error::deploy fallo"; exit 1; fi

          # Confirmar lo que quedó, en vez de confiar en el 200.
          curl -sS "$API_BASE" -H "Authorization: Bearer $RENDER_KEY" -o svc.json
          echo "Plan actual según Render: $(jq -r '.serviceDetails.plan // "?"' svc.json)"
          echo "Listo ($aplicado)"
