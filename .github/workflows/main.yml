name: keep-alive
# DESACTIVADO (schedule sacado) — mantener la API despierta 24/7 en el plan FREE se
# come las 750 horas mensuales y Render suspende el servicio a fin de mes (pasó el
# 2026-08-31: 762/750 → suspendido). Ahora dejamos que el free DUERMA cuando no hay
# tráfico (usa pocas horas, no llega al tope) y los findes de partido el cron
# render-matchday.yml lo sube a Starter (always-on, sin tope). Trade-off: cold-start
# lento en la primera visita entre semana. Se deja en manual por si hace falta.
on:
  workflow_dispatch: {}

# Una sola corrida a la vez, encadenadas: si el schedule dispara mientras una
# corre, la nueva queda pendiente y arranca apenas termina la anterior → sin
# huecos. cancel-in-progress:false para NO cortar la que está manteniendo viva
# la API.
concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - name: Mantener la API despierta (loop interno)
        env:
          BASE: https://rugby-chile-api.onrender.com
        run: |
          set +e
          # GitHub Actions atrasa los cron programados (se vieron gaps reales de
          # 25-58 min entre corridas), MÁS que los 15 min que tarda Render free
          # en dormirse — por eso el keep-alive corría pero la API se enfriaba
          # igual. En vez de depender de que GitHub dispare a tiempo, cada
          # corrida mantiene la API despierta ~52 min pingeando cada 4 min. Con
          # el schedule cada 10 min y concurrency encadenada, la cobertura queda
          # continua.
          warm_all() {
            curl -sf --max-time 90 "$BASE/health" -o /dev/null && echo "$(date -u +%H:%M:%S) health ok"
            for d in PRIMERA INTERMEDIA PRE_INTERMEDIA; do
              curl -s --max-time 90 "$BASE/api/v1/leverade/standings?division=$d" -o /dev/null
              curl -s --max-time 90 "$BASE/api/v1/stats/players?division=$d" -o /dev/null
            done
            curl -s --max-time 90 "$BASE/api/v1/leverade/results" -o /dev/null
            curl -s --max-time 90 "$BASE/api/v1/predict/season" -o /dev/null
            echo "$(date -u +%H:%M:%S) caches warmed"
          }
          warm_all
          END=$((SECONDS + 52 * 60))
          while [ $SECONDS -lt $END ]; do
            sleep 240
            curl -sf --max-time 90 "$BASE/health" -o /dev/null && echo "$(date -u +%H:%M:%S) ping ok"
          done
          exit 0
